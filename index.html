<title>CH32H417 引脚配置</title>
<style>
/* Layout: EDA-style workbench — peripheral tree | package view | inspector; stacks to one column on phones */
:root{
  --bg:#f4f3ef; --panel:#fdfdfb; --ink:#1d2024; --muted:#646a72; --line:#dcdad2; --soft:#eceae3;
  --mask:#1f2329;          /* chip body: graphite */
  --pad:#cbc8bd;           /* unassigned pad */
  --af:#0b7d79;            /* assigned digital function: teal */
  --ana:#7c4dc4;           /* analog / dedicated: violet */
  --gpio:#2f68d0;          /* plain GPIO: blue */
  --warn:#b86e00; --bad:#d02f3a; --pwr:#9c9a92; --sp:#5d6169;
  --chipText:#e9e7e0;
  --font-ui:"Noto Sans SC","IBM Plex Sans Condensed",system-ui,sans-serif;
  --font-head:"IBM Plex Sans Condensed","Noto Sans SC",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131518; --panel:#1b1e23; --ink:#e8e8e3; --muted:#9aa0a8; --line:#2c3037; --soft:#24282e;
  --mask:#0a0c0f; --pad:#4b4f56; --af:#2fc2ba; --ana:#b690ee; --gpio:#6ba2ff;
  --warn:#e8a33a; --bad:#ff6b73; --pwr:#676b72; --sp:#9aa0a8; --chipText:#cfcdc6; --btnOn:#0a0c0f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131518; --panel:#1b1e23; --ink:#e8e8e3; --muted:#9aa0a8; --line:#2c3037; --soft:#24282e;
  --mask:#0a0c0f; --pad:#4b4f56; --af:#2fc2ba; --ana:#b690ee; --gpio:#6ba2ff;
  --warn:#e8a33a; --bad:#ff6b73; --pwr:#676b72; --sp:#9aa0a8; --chipText:#cfcdc6; --btnOn:#0a0c0f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--af);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--font-head);font-size:22px;font-weight:700;margin:0;letter-spacing:.01em}
.brand .part{font-family:var(--font-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:3px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:4px;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--af);border-color:var(--af);color:var(--btnOn,#fff)}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:1180px){.wrap{grid-template-columns:260px minmax(0,1fr)}.insp{grid-column:1/-1}}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.center{order:-1}.insp{order:0}.side{order:1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.side{max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:8px}
@media (max-width:760px){.side{max-height:none;position:static}}
.side .search{position:sticky;top:0;background:var(--panel);padding:10px;border-bottom:1px solid var(--line);z-index:2}
.side input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--bg)}
.grp>summary{font-family:var(--font-head);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;cursor:pointer;list-style:none;border-bottom:1px solid var(--soft)}
.grp>summary::-webkit-details-marker{display:none}
.per{border-bottom:1px solid var(--soft)}
.per>summary{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;cursor:pointer;list-style:none;font-family:var(--font-mono);font-size:13px}
.per>summary::-webkit-details-marker{display:none}
.per>summary .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.per>summary .dot{width:8px;height:8px;border-radius:50%;background:var(--pad);flex:none}
.per.on>summary .dot{background:var(--af)}
.per.bad>summary .dot{background:var(--bad)}
.sig{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:6px;align-items:center;padding:3px 10px 3px 24px;font-family:var(--font-mono);font-size:12px}
.sig label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig select{width:100%;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-size:12px;padding:2px}
.sig.set label{color:var(--af);font-weight:600}
.center{padding:8px;display:flex;flex-direction:column;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.svgbox{overflow:auto}
svg#chip{display:block;width:100%;height:auto;min-width:620px;max-width:960px;margin:0 auto}
.pin rect{cursor:pointer}
.pin text{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink);cursor:pointer}
.pin text.fn{font-weight:600}
.pin:hover rect{stroke:var(--ink);stroke-width:1.2}
.pin.sel rect{stroke:var(--ink);stroke-width:2}
.pin.hl rect{stroke:var(--warn);stroke-width:2.2}
.insp{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--af);font-weight:600}
.tabs .badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;font-size:11px;background:var(--soft);margin-left:4px;text-align:center}
.tabs .badge.bad{background:var(--bad);color:#fff}
.tabs .badge.warn{background:var(--warn);color:#fff}
.tabbody{padding:12px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0 0 10px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--font-mono)}
.pinhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.pinhead b{font-family:var(--font-mono);font-size:20px}
.pinhead span{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:2px 6px;background:var(--bg)}
button.chip:hover{border-color:var(--af)}
button.chip.cur{background:var(--af);border-color:var(--af);color:var(--btnOn,#fff)}
.chip.ana{border-style:dashed}
.h3{font-family:var(--font-head);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row label{font-size:12px;color:var(--muted)}
.row select,.row input{border:1px solid var(--line);border-radius:3px;background:var(--bg);padding:3px 6px;font-size:12px}
.note{font-size:12.5px;padding:8px 10px;border-radius:4px;background:var(--soft);margin:6px 0;border-left:3px solid var(--muted)}
.note.warn{border-left-color:var(--warn)}.note.bad{border-left-color:var(--bad)}.note.ok{border-left-color:var(--af)}
.issue{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:13px}
.issue .lv{flex:none;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;height:fit-content;color:#fff}
.lv.bad{background:var(--bad)}.lv.warn{background:var(--warn)}.lv.info{background:var(--muted)}
.issue a{color:inherit;text-decoration:underline;cursor:pointer}
table.list{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.list th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap}
table.list td{border-bottom:1px solid var(--soft);padding:4px 6px;font-family:var(--font-mono)}
table.list tr{cursor:pointer}table.list tr:hover td{background:var(--soft)}
.tblwrap{overflow-x:auto}
pre.code{font-family:var(--font-mono);font-size:12px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto;max-height:520px;margin:8px 0 0;white-space:pre}
textarea.io{width:100%;box-sizing:border-box;min-height:140px;font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:8px}
.empty{color:var(--muted);font-size:13px}
.foot{margin-top:14px;font-size:12px;color:var(--muted);max-width:900px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

    <div class="tabbody" id="body"></div>
  </section>
</div>

<p class="foot">数据来源：CH32H417/H416/H415 数据手册 V1.9 第 2.2 节引脚定义表和第 2.3 节复用功能表；供电域取自数据手册 1.4.45 节的三份引脚清单。同一信号的候选引脚按手册列出的顺序排列，即输入复用的优先级顺序。手册两张表互相矛盾的地方在「检查」页标出，画板前请以实测为准。生成的代码使用沁恒标准外设库（ch32h417_gpio.h / ch32h417_rcc.h）的函数名。</p>

<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const PINS=D.pins.map(p=>({num:p[0],name:p[1],kind:p[2],ft:!!p[3],vio:p[4]===1,dom:p[4],af:p[5].map(x=>[x[0].replace(/^CAN_(RX|TX)$/,'CAN1_$1'),x[1]]),extra:p[6]}));
const BYNAME={};PINS.forEach(p=>BYNAME[p.name]=p);
const SIG=D.sig;
const PO=new Set((D.po||[]).map(x=>x.join('|'))); // key -> [[pin,af|null],...] in manual order
// alias: individual name -> table key (handles "SPI2_NSS/I2S2_WS")
const ALIAS={};Object.keys(SIG).forEach(k=>k.split('/').forEach(n=>ALIAS[n]=k));
const SKEY=n=>ALIAS[n]||n;

/* ---------- peripheral model ---------- */
function perOf(s){
  if(/^RGMII_|^ETH_/.test(s))return 'ETH';
  if(/^OTG_/.test(s))return 'USBFS';
  if(/^USBHS_/.test(s))return 'USBHS';
  if(/^CC[12]$/.test(s))return 'USBPD';
  if(/^SW(CLK|DIO)/.test(s))return 'SWD';
  if(/^OSC32_/.test(s))return 'LSE';
  if(/^ADC_IN/.test(s))return 'ADC';
  if(/^HSADC_IN/.test(s))return 'HSADC';
  if(/^DAC\d/.test(s))return s.slice(0,4);
  if(/^SPI(\d)_.*\/I2S\d_/.test(s))return 'SPI'+s[3]+'/I2S'+s[3];
  if(/^I2S(\d)_/.test(s))return 'SPI'+s[3]+'/I2S'+s[3];
  if(/^SAI_/.test(s))return 'SAI';
  if(/^CMP_/.test(s))return 'CMP';
  const m=s.match(/^([A-Z]+\d*)_/);return m?m[1]:s;
}
const GROUPS=[
  ['电机与定时器',/^(TIM\d+|LPTIM\d)$/],
  ['总线通信',/^(CAN\d|USART\d|SPI\d.*|I2C\d|I3C|QSPI\d|SWPMI)$/],
  ['模拟',/^(ADC|HSADC|DAC\d|OPA\d|CMP|DFSDM)$/],
  ['USB 与网络',/^(USBFS|USBHS|USBPD|ETH|SERDES)$/],
  ['图像、显示与存储',/^(LTDC|DVP|SAI|SDIO|FSMC|SDRAM)$/],
  ['系统',/^(SWD|LSE|MCO|PIOC|RTC)$/]
];
const PER={};
Object.keys(SIG).forEach(s=>{const p=perOf(s);(PER[p]=PER[p]||[]).push(s)});
const natural=(a,b)=>a.localeCompare(b,'en',{numeric:true});
Object.values(PER).forEach(a=>a.sort(natural));

/* ---------- state ---------- */
// assign[pinName] = {fn, af (number|null), kind:'af'|'ana'|'gpio', mode, pull, label}
let A={};
const LS='ch32h417-pins-v1';
function save(){try{localStorage.setItem(LS,JSON.stringify(A))}catch(e){}}
function load(){try{const s=localStorage.getItem(LS);if(s){A=JSON.parse(s)||{};return true}}catch(e){}return false}

const ANA_RE=/^(ADC_IN|HSADC_IN|DAC\d_OUT|OPA\d_|CMP_[PN])/;
const DEDICATED_RE=/^(OTG_|USBHS_|SWCLK|SWDIO|OSC32_|SERDES_|RTC$)/;
function defaultMode(fn,kind){
  if(kind==='ana')return DEDICATED_RE.test(fn)?'DED':'AIN';
  if(kind==='gpio')return fn==='GPIO_OUT'?'Out_PP':'IN_FLOATING';
  if(/^I2C\d_|^I3C_/.test(fn))return 'AF_OD';
  if(/CAN\d_RX|USART\d_RX|_RX$/.test(fn))return 'IPU';
  if(/_(MISO|CTS|ETR|BKIN2?|CKIN\d|DATIN\d)$|^DVP_|^RGMII_R/.test(fn))return 'IN_FLOATING';
  return 'AF_PP';
}
function setPin(pin,fn,af){
  const kind=fn==='GPIO_OUT'||fn==='GPIO_IN'?'gpio':(af==null?'ana':'af');
  const old=A[pin]||{};
  A[pin]={fn,af:af==null?null:af,kind,mode:defaultMode(fn,kind),label:old.label||''};
  save();render();
}
function clearPin(pin){delete A[pin];save();render()}
function pinsOfSig(s){return Object.keys(A).filter(p=>A[p].fn===s||SKEY(A[p].fn)===s)}

/* ---------- checks ---------- */
const SWD_PINS=['PB8','PB9'];
function analyze(){
  const issues=[];const pinState={};
  const sigUse={};
  Object.entries(A).forEach(([p,a])=>{if(a.kind!=='gpio'){const k=SKEY(a.fn);(sigUse[k]=sigUse[k]||[]).push(p)}});
  // same signal on several pins
  Object.entries(sigUse).forEach(([k,ps])=>{if(ps.length>1&&!/^ADC_IN|^HSADC_IN/.test(k)){issues.push({lv:'bad',pins:ps,t:`${k} 被同时分配到 ${ps.join('、')}。一个信号只能接一个引脚。`});ps.forEach(p=>pinState[p]='bad')}});
  // priority rule (datasheet 2.3 note 1)
  Object.entries(A).forEach(([p,a])=>{
    if(a.kind!=='af')return;const k=SKEY(a.fn);const c=SIG[k];if(!c)return;
    const idx=c.findIndex(x=>x[0]===p);if(idx<=0)return;
    for(let i=0;i<idx;i++){const [hp,haf]=c[i];const h=A[hp];
      if(h&&h.kind==='af'&&h.af===haf&&hp!==p){issues.push({lv:'warn',pins:[p,hp],t:`${k} 用的是低优先级引脚 ${p}，但更高优先级的 ${hp} 也配成了 AF${haf}（${h.fn}）。手册第 2.3 节规定这种情况下 ${hp} 不能配成 AF${haf}，输入信号会被高优先级引脚抢走。`});pinState[p]=pinState[p]||'warn';pinState[hp]=pinState[hp]||'warn'}}
  });
  // af on pin not matching pin table
  Object.entries(A).forEach(([p,a])=>{
    if(a.kind!=='af')return;const pin=BYNAME[p];
    const names=SKEY(a.fn).split('/');
    const ok=pin.af.some(x=>x[1]===a.af&&(names.includes(x[0])||x[0]===a.fn));
    if(!ok&&!(p==='PC1'&&a.fn==='SAI_SD_A'))issues.push({lv:'warn',pins:[p],t:`手册两张表对 ${p} 的 ${a.fn} 说法不一致：复用功能表写 AF${a.af}，引脚定义表里${(()=>{const g=pin.af.filter(x=>names.includes(x[0])||x[0].replace(/^CAN_/,'CAN1_')===names[0]);return g.length?'写的是 AF'+g.map(x=>x[1]).join('/'):'找不到这一项'})()}。上板前请用例程或示波器确认。`});
  });
  Object.entries(A).forEach(([p,a])=>{if(a.kind==='af'&&PO.has(a.fn+'|'+p+'|'+a.af))issues.push({lv:'warn',pins:[p],t:`${p} 的 ${a.fn}（AF${a.af}）只出现在引脚定义表里，第 2.3 节复用功能表没有这一项。手册没有给出第二个来源，请用例程或实测确认。`})});
  if(A['PC1']&&A['PC1'].fn==='SAI_SD_A')issues.push({lv:'warn',pins:['PC1'],t:'PC1 的 SAI_SD_A：引脚定义表写 AF7（同一格还写着 PIOC_IO0），复用功能表写 AF6。官方例程 SAI_Play 用的是 AF6，基本可以确定 AF6 是对的。'});
  const ser=Object.keys(A).filter(p=>/^SERDES_/.test(A[p].fn));
  if(ser.length)issues.push({lv:'warn',pins:ser,t:'SerDes 引脚方向手册前后矛盾：引脚定义表写 PE3/PE4 是 TXP/TXN、PE5/PE6 是 RXP/RXN，第 2.3 节的 SerDes 表正好反过来。画板前问沁恒确认。'});
  // SWD
  const swd=SWD_PINS.filter(p=>A[p]&&!/^SW(CLK|DIO)/.test(A[p].fn));
  if(swd.length)issues.push({lv:'warn',pins:swd,t:`${swd.join('、')} 是 SWD 下载调试脚（SWCLK=PB8，SWDIO=PB9）。挪作他用后就不能在线调试，量产板要留好下载方式。`});
  // power domains (datasheet 1.4.45)
  const vio=Object.keys(A).filter(p=>BYNAME[p].dom===1);
  if(vio.length)issues.push({lv:'info',pins:vio,t:`${vio.join('、')} 属于 VIO18 供电的高速 IO，支持 1.2V/1.8V/2.5V/3.3V，上电默认电压由 XO 脚下拉电阻决定（默认 1.8V，数据手册 p91），之后可改 PWR_CTLR 的 [12:9]。接 3.3V 外设前要先把 VIO18 配成 3.3V，或把 VIO18 引脚直接接到 VDDIO。`});
  const d33=Object.keys(A).filter(p=>BYNAME[p].dom===2);
  if(d33.length)issues.push({lv:'info',pins:d33,t:`${d33.join('、')} 由 VDD33 供电，固定 3.3V，不随 VDDIO 变化。`});
  const dio=Object.keys(A).filter(p=>BYNAME[p].dom===0&&BYNAME[p].kind==='io');
  if(dio.length)issues.push({lv:'info',pins:dio,t:`${dio.join('、')} 由 VDDIO 供电，支持 1.8V/2.5V/3.3V，电平跟随你接的 VDDIO。`});
  const nod=Object.keys(A).filter(p=>BYNAME[p].dom===3);
  if(nod.length)issues.push({lv:'info',pins:nod,t:`${nod.join('、')} 没有列在数据手册 1.4.45 的供电域清单里（它们同时是 USB/SWD 脚），供电域请按硬件设计指南确认。`});
  // PC13-15
  const bk=['PC13','PC14','PC15'].filter(p=>A[p]&&A[p].kind==='gpio'&&A[p].fn==='GPIO_OUT');
  if(bk.length)issues.push({lv:'warn',pins:bk,t:`${bk.join('、')} 做输出时只能跑 2MHz、负载不超过 30pF，不能当电流源（比如直接驱动 LED）。见数据手册引脚表注 4。`});
  // CAN notes
  const cans=new Set(Object.values(A).map(a=>perOf(SKEY(a.fn))).filter(x=>/^CAN\d$/.test(x)));
  if(cans.size){issues.push({lv:'info',pins:[],t:'用到 CAN 时注意：A 版芯片不支持 CAN 硬件过滤，要用官方例程里的软件过滤。'});
    if(cans.has('CAN2')||cans.has('CAN3'))issues.push({lv:'info',pins:[],t:'CAN2、CAN3 共用 CAN1 的滤波器，官方例程在开 CAN2/CAN3 时钟时也一并打开了 CAN1 时钟，生成的代码已经照做。'});}
  // FT note for 5V
  // unpaired per-peripheral (e.g. TX without RX)
  const pairs=[['_TX','_RX'],['_SCL','_SDA']];
  const used=new Set(Object.values(A).map(a=>SKEY(a.fn)));
  used.forEach(k=>{pairs.forEach(([a,b])=>{if(k.endsWith(a)&&/^(CAN|I2C)/.test(k)&&!used.has(k.slice(0,-a.length)+b))issues.push({lv:'info',pins:[],t:`${k} 已分配，但 ${k.slice(0,-a.length)+b} 还没有分配。`})})});
  return {issues,pinState};
}

/* ---------- chip drawing ---------- */
const svg=document.getElementById('chip');
const NS='http://www.w3.org/2000/svg';
const B0=270,B1=730,N=32,PITCH=(B1-B0)/(N+1),PL=36,PW=8.2;
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
function pinGeom(n){ // QFN: 1-32 left top->bottom, 33-64 bottom left->right, 65-96 right bottom->top, 97-128 top right->left
  const i=(n-1)%N,side=Math.floor((n-1)/N),off=B0+PITCH*(i+1);
  if(side===0)return{x:B0-PL,y:off-PW/2,w:PL,h:PW,tx:B0-PL-4,ty:off+3.3,anchor:'end',rot:0,cx:B0-PL,cy:off};
  if(side===1)return{x:off-PW/2,y:B1,w:PW,h:PL,tx:off+3.3,ty:B1+PL+4,anchor:'start',rot:90,cx:off,cy:B1+PL};
  if(side===2){const y=B1-PITCH*(i+1);return{x:B1,y:y-PW/2,w:PL,h:PW,tx:B1+PL+4,ty:y+3.3,anchor:'start',rot:0,cx:B1+PL,cy:y}}
  const x=B1-PITCH*(i+1);return{x:x-PW/2,y:B0-PL,w:PW,h:PL,tx:x+3.3,ty:B0-PL-4,anchor:'start',rot:-90,cx:x,cy:B0-PL};
}
let SEL=null,HL=new Set();
function shortFn(a){if(!a)return '';let s=a.label||a.fn;if(a.fn==='GPIO_OUT'&&!a.label)s='GPIO_Out';if(a.fn==='GPIO_IN'&&!a.label)s='GPIO_In';return s.length>18?s.slice(0,17)+'…':s}
function drawChip(st){
  svg.innerHTML='';
  const css=getComputedStyle(document.documentElement);const v=n=>css.getPropertyValue(n).trim();

const BUS={HB:['DVP','ETH','OTG_FS','PIOC','USBHS','USBPD','USBSS','SERDES','SDMMC','FMC'],
 HB1:['CAN1','CAN2','CAN3','DAC','I2C1','I2C2','I2C3','LPTIM1','LPTIM2','QSPI1','QSPI2','SPI2','SPI3','SPI4','SWPMI','TIM2','TIM3','TIM4','TIM5','TIM6','TIM7','USART2','USART3','USART4','USART5','USART6','USART7','USART8'],
 HB2:['ADC1','ADC2','DFSDM','HSADC','I2C4','I3C','LTDC','OPCM','SAI','SDIO','SPI1','TIM1','TIM8','TIM9','TIM10','TIM11','TIM12','USART1']};
function clkOf(per){
  if(/^SPI(\d)\//.test(per))return ['SPI'+per[3]];
  if(/^CAN[23]$/.test(per))return ['CAN1',per];
  if(per==='FSMC'||per==='SDRAM')return ['FMC'];
  if(/^(SWD|LSE|MCO|RTC)$/.test(per))return [];
  if(per==='USBFS')return ['OTG_FS'];if(per==='ADC')return ['ADC1'];if(/^DAC/.test(per))return ['DAC'];
  if(/^OPA|^CMP/.test(per))return ['OPCM'];if(per==='SERDES')return ['SERDES'];
  return [per];
}
function busOf(c){for(const b in BUS)if(BUS[b].includes(c))return b;return null}
function genCode(){
  const rows=Object.entries(A).sort((x,y)=>natural(x[0],y[0]));
  if(!rows.length)return '/* 还没有分配引脚 */';
  const ports=new Set(),clk={HB:new Set(),HB1:new Set(),HB2:new Set()},skipped=[];
  let anyAF=false;
  rows.forEach(([p,a])=>{if(a.mode!=='DED')ports.add(p[1]);if(a.kind==='af')anyAF=true;
    if(a.kind!=='gpio'){clkOf(perOf(SKEY(a.fn))).forEach(c=>{const b=busOf(c);if(b)clk[b].add(c);else skipped.push(c)})}});
  let s='/* 实验功能：由 CH32H417 引脚配置工具生成，未经上板验证，使用前请对照官方例程。基于数据手册 V1.9，使用沁恒标准外设库 */\n#include "ch32h417.h"\n\n';
  const labeled=rows.filter(([,a])=>a.label);
  if(labeled.length){labeled.forEach(([p,a])=>{s+=`#define ${a.label}_PORT   GPIO${p[1]}\n#define ${a.label}_PIN    GPIO_Pin_${p.slice(2)}\n`});s+='\n'}
  s+='void Pins_Init(void)\n{\n    GPIO_InitTypeDef GPIO_InitStructure = {0};\n\n';
  s+=`    RCC_HB2PeriphClockCmd(${anyAF?'RCC_HB2Periph_AFIO | ':''}${[...ports].sort().map(x=>'RCC_HB2Periph_GPIO'+x).join(' | ')}, ENABLE);\n`;
  if(clk.HB.size)s+=`    RCC_HBPeriphClockCmd(${[...clk.HB].map(c=>'RCC_HBPeriph_'+c).join(' | ')}, ENABLE);\n`;
  if(clk.HB1.size)s+=`    RCC_HB1PeriphClockCmd(${[...clk.HB1].sort(natural).map(c=>'RCC_HB1Periph_'+c).join(' | ')}, ENABLE);\n`;
  if(clk.HB2.size)s+=`    RCC_HB2PeriphClockCmd(${[...clk.HB2].sort(natural).map(c=>'RCC_HB2Periph_'+c).join(' | ')}, ENABLE);\n`;
  rows.forEach(([p,a])=>{
    const port='GPIO'+p[1],n=p.slice(2);
    s+=`\n    /* ${p}（${BYNAME[p].num} 号脚）: ${a.fn}${a.af!=null?' AF'+a.af:''}${a.label?'  '+a.label:''} */\n`;
    if(a.mode==='DED'){s+='    /* 专用功能，由外设自身接管，不需要配置 GPIO */\n';return}
    if(a.kind==='af')s+=`    GPIO_PinAFConfig(${port}, GPIO_PinSource${n}, GPIO_AF${a.af});\n`;
    s+=`    GPIO_InitStructure.GPIO_Pin = GPIO_Pin_${n};\n    GPIO_InitStructure.GPIO_Mode = GPIO_Mode_${a.mode};\n`;
    if(!/^(AIN|IN_FLOATING|IPU|IPD)$/.test(a.mode))s+=`    GPIO_InitStructure.GPIO_Speed = ${a.kind==='gpio'?'GPIO_Speed_Medium':'GPIO_Speed_Very_High'};\n`;
    s+=`    GPIO_Init(${port}, &GPIO_InitStructure);\n`;
  });
  s+='}\n';
  if(skipped.length)s+=`\n/* 以下外设的时钟请自行打开：${[...new Set(skipped)].join('、')} */\n`;
  return s;
}
